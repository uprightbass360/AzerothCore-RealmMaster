name: Publish config UI

on:
  push:
    branches: [main]
    # Only what the site is built from. The manifest sync dispatches this
    # workflow directly after merging (its GITHUB_TOKEN merge triggers no push).
    paths:
      - 'tools/config-ui/**'
      - 'config/**'
      - 'img/config-builder-banner.jpg'
      - '.github/workflows/config-ui-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling one mid-flight, which can leave the
# Pages deployment stuck; the newest queued run still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Round-trip format check (gates deploy)
        run: python3 tools/config-ui/check_roundtrip.py

      - name: Assemble site (no transform — data is byte-identical to main)
        run: |
          mkdir -p _site/config _site/img
          cp tools/config-ui/index.html tools/config-ui/app.js tools/config-ui/style.css _site/
          cp img/config-builder-banner.jpg _site/img/
          cp config/module-manifest.json _site/config/
          cp -r config/module-profiles _site/config/
          cp -r config/presets _site/config/
          python3 tools/config-ui/gen_index.py _site/config

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
