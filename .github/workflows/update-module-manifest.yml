name: Sync Module Manifest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update manifest from GitHub topics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/python/update_module_manifest.py --log --prune-missing

      - name: Config UI round-trip check
        # Same gate the Pages deploy runs; a sync PR must never leave profiles
        # referencing keys the manifest no longer has.
        run: python3 tools/config-ui/check_roundtrip.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in manifest or template files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --name-only
          fi

      - name: Create Pull Request with changes
        id: cpr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: sync module manifest'
          branch: chore/update-module-manifest
          title: 'chore: sync module manifest'
          body: |
            Automated manifest refresh via GitHub topic sync.

            Entries whose upstream repository returned a hard 404/451 are
            removed. Repos that merely dropped the topic are verified via the
            GitHub API and kept.

            Merged automatically once the in-job gates pass: the sync aborts
            pruning on any GitHub API error or if removals exceed 10% of the
            manifest, and the config UI round-trip check must succeed.
          labels: modules
          delete-branch: true

      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # Mergeability is computed asynchronously right after creation, so
          # retry briefly instead of failing on the first "not mergeable".
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --squash; then
              echo "Merged PR #$PR"
              exit 0
            fi
            echo "Merge attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "::error::Could not merge PR #$PR; leaving it open for manual review"
          exit 1

      - name: Refresh config UI
        # A merge performed with GITHUB_TOKEN does not trigger push workflows,
        # so the Pages deploy must be dispatched explicitly.
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run config-ui-pages.yml --ref main
